[package]
name = "daymark-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
daymark-domain = { path = "..", features = ["serde"] }
daymark-persistence = { path = "../persistence" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
rpassword = "7"
zeroize = "1"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
