[package]
name = "daymark-domain"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["persistence", "application"]
default-members = [".", "persistence", "application"]
resolver = "3"

[features]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
